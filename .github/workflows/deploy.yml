name: Deploy Firebase Cloud Function

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate environment variables
        run: node validate-env.js
        env:
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_ANALYTICS_DATASET: ${{ secrets.BIGQUERY_ANALYTICS_DATASET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

      - name: Create .env for Cloud Function runtime
        run: |
          echo "BIGQUERY_PROJECT_ID=${{ secrets.BIGQUERY_PROJECT_ID }}" > .env
          echo "BIGQUERY_ANALYTICS_DATASET=${{ secrets.BIGQUERY_ANALYTICS_DATASET }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "SCHEDULER_SECRET=${{ secrets.SCHEDULER_SECRET }}" >> .env
          echo "ADMIN_KEY=${{ secrets.ADMIN_KEY }}" >> .env

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive
        env:
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_ANALYTICS_DATASET: ${{ secrets.BIGQUERY_ANALYTICS_DATASET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
